[project]
name = "physics-m3-workspace"
version = "1.0.0"
description = "Computational Mechanics Workspace for Multi-Scale (M³) Analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pytest>=7.0",
    "jupyter>=1.0",
]

[project.optional-dependencies]
fenics = ["fenics>=2019"]
sfepy = ["sfepy>=2023"]
dev = ["pytest-cov", "black", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
