# lab-sync.yml
# Sincroniza workspace entre agentes (shared/, meetings/, publications/)
# Versiona dados grandes via DVC + Git LFS
name: Lab Sync

on:
  push:
    branches: [main]
    paths:
      - 'workspace/**/shared/**'
      - 'workspace/**/meetings/**'
      - 'workspace/**/context/**'
      - 'workspace/**/team/**'
  schedule:
    - cron: '17 */6 * * *'  # a cada 6h (minuto 17 para evitar pico)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install DVC
        run: |
          pip install dvc dvc-s3 dvc-gs 2>/dev/null || pip install dvc 2>/dev/null || echo "DVC optional — continuing without"

      - name: DVC pull (restore cached data)
        continue-on-error: true
        run: |
          if command -v dvc &> /dev/null && [ -f "dvc.lock" ]; then
            dvc pull --jobs 2
            echo "DVC pull completed"
          else
            echo "No DVC config found — skipping"
          fi

      - name: Verify workspace structure
        run: |
          echo "Verifying workspace structure..."
          REQUIRED_DIRS=(
            "workspace/template/context"
            "workspace/template/team"
            "workspace/template/meetings"
            "workspace/template/vvv"
            "workspace/template/shared"
          )
          MISSING=0
          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              echo "  ✓ $dir"
            else
              echo "  ⚠ $dir — missing (will be created)"
              mkdir -p "$dir"
            fi
          done
          echo "Structure verification complete"

      - name: Check coordinator consistency
        run: |
          echo "Checking coordinator consistency..."
          COORD_DIR="workspace/template/team/coordinator"
          if [ -d "$COORD_DIR" ]; then
            # Verify essential scripts exist
            for script in coordinator.sh agent-factory.sh task-board.sh dependency-check.sh meeting-convener.sh deadlock-resolver.sh; do
              if [ -f "$COORD_DIR/$script" ]; then
                echo "  ✓ $script"
              else
                echo "  ⚠ $script — missing"
              fi
            done
            # Verify schema
            if [ -f "$COORD_DIR/schema/meeting.json" ]; then
              echo "  ✓ schema/meeting.json"
            fi
          fi
          echo "Coordinator check complete"

      - name: Sync shared/ — check for stale context
        run: |
          echo "Checking shared/ for stale contexts..."
          for ctx_dir in workspace/*/context; do
            [ -d "$ctx_dir" ] || continue
            find "$ctx_dir" -name '*.json' -mtime +30 2>/dev/null | while read -r f; do
              echo "  ⚠ Stale context (>30d): $f"
            done
          done
          echo "Stale check complete"

      - name: Sync meetings/ — consolidate atas
        run: |
          echo "Checking meetings directories..."
          for mtg_dir in workspace/*/meetings; do
            [ -d "$mtg_dir" ] || continue
            find "$mtg_dir" -name '*.md' 2>/dev/null | while read -r f; do
              echo "  Meeting file: $f ($(wc -l < "$f") lines)"
            done
          done
          echo "Meetings check complete"

      - name: Sync coordinator status
        run: |
          echo "Checking coordinator status across projects..."
          for coord_dir in workspace/*/team/coordinator; do
            [ -d "$coord_dir" ] || continue
            project=$(echo "$coord_dir" | cut -d/ -f2)
            if [ -f "$coord_dir/team-composition.md" ]; then
              agent_count=$(grep -cE '^\|.*\|.*\|.*\|.*ATIVO' "$coord_dir/team-composition.md" 2>/dev/null || echo 0)
              task_count=$(grep -cE '^\|.*TASK-' "$coord_dir/team-composition.md" 2>/dev/null || echo 0)
              echo "  $project: $agent_count agentes, $task_count tarefas"
            fi
          done
          echo "Coordinator status check complete"

      - name: Generate workspace index
        run: |
          echo "Generating workspace index..."
          INDEX_FILE="workspace/INDEX.md"
          {
            echo "# Workspace Index"
            echo "Auto-generated by lab-sync CI — $(date -Iseconds)"
            echo ""
            echo "## Structure"
            echo ""
            for dir in workspace/*/; do
              [ -d "$dir" ] || continue
              name=$(basename "$dir")
              file_count=$(find "$dir" -type f 2>/dev/null | wc -l)
              echo "- **$name**: $file_count files"
            done
            echo ""
            echo "## Recent Context Changes"
            echo ""
            for ctx_dir in workspace/*/context; do
              [ -d "$ctx_dir" ] || continue
              find "$ctx_dir" -name '*.json' -mtime -7 2>/dev/null | while read -r f; do
                echo "- $f"
              done
            done
          } > "$INDEX_FILE"
          echo "Index generated: $INDEX_FILE"

      - name: DVC push (if configured)
        continue-on-error: true
        run: |
          if command -v dvc &> /dev/null && [ -f "dvc.yaml" ]; then
            dvc push --jobs 2
            echo "DVC push completed"
          else
            echo "No DVC config — skipping push"
          fi

      - name: Summary
        run: |
          echo "══════════════════════════════════"
          echo "  LAB SYNC COMPLETE"
          echo "══════════════════════════════════"
          echo "  Timestamp: $(date -Iseconds)"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "══════════════════════════════════"
