# publish-paper.yml
# Gera PDF + estrutura de paper via template CRSLR + Research-Paper-Writing skill
# Conecta F8 (Comunicar Resultados) → F10 (Publicar) do workflow Omnibus
name: Publish Paper

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project name (e.g., pa-eolica-v3)'
        required: true
      paper_title:
        description: 'Paper title'
        required: true
      authors:
        description: 'Authors (comma-separated)'
        required: false
        default: 'Agente Multidisciplinar'
      journal:
        description: 'Target journal/archive (e.g., arXiv, engrXiv, JBE)'
        required: false
        default: 'engrXiv'
      template:
        description: 'Paper template (IMRaD | CRSLR)'
        required: false
        default: 'IMRaD'

jobs:
  generate-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install publishing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-science \
            texlive-publishers texlive-bibtex-extra biber
          pip install pandoc-latex-environment 2>/dev/null || true
          echo "Tools installed"

      - name: Gather project context
        id: context
        run: |
          PROJECT_DIR="workspace/${{ github.event.inputs.project }}"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          if [ -d "$PROJECT_DIR" ]; then
            echo "Project directory: $PROJECT_DIR"
            find "$PROJECT_DIR" -type f | head -50
            CONTEXT_FILES=$(find "$PROJECT_DIR" -name '*.json' -path '*/context/*' 2>/dev/null || true)
            echo "context_count=$(echo "$CONTEXT_FILES" | wc -l)" >> "$GITHUB_OUTPUT"
          else
            echo "Project not found. Using template context."
            echo "context_count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate paper structure
        id: generate
        run: |
          export PROJECT="${{ github.event.inputs.project }}"
          export TITLE="${{ github.event.inputs.paper_title }}"
          export AUTHORS="${{ github.event.inputs.authors }}"
          export TEMPLATE="${{ github.event.inputs.template }}"

          SAFE_TITLE=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          export SAFE_TITLE

          OUTPUT_DIR="workspace/$PROJECT/publications"
          export OUTPUT_DIR
          PAPER_DIR="$OUTPUT_DIR/$SAFE_TITLE"
          export PAPER_DIR
          mkdir -p "$PAPER_DIR"

          python3 .github/scripts/generate-paper.py paper

          echo "paper_dir=$PAPER_DIR" >> "$GITHUB_OUTPUT"
          echo "safe_title=$SAFE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Include VVV results and context data
        run: |
          PAPER_DIR="${{ steps.generate.outputs.paper_dir }}"
          PROJECT="${{ github.event.inputs.project }}"

          VVV_REPORTS=$(find "workspace/$PROJECT" -name '*vvv*' -name '*.md' 2>/dev/null || true)
          if [ -n "$VVV_REPORTS" ]; then
            echo "$VVV_REPORTS" | while read -r report; do
              echo "Found VVV report: $report"
              cp "$report" "$PAPER_DIR/data/" 2>/dev/null || true
            done
          fi

          CONTEXT_FILES=$(find "workspace/$PROJECT" -name '*.json' -path '*/context/*' 2>/dev/null || true)
          if [ -n "$CONTEXT_FILES" ]; then
            echo "$CONTEXT_FILES" | head -10 > "$PAPER_DIR/data/sources.txt"
            echo "Context sources linked"
          fi

      - name: Compile PDF
        run: |
          PAPER_DIR="${{ steps.generate.outputs.paper_dir }}"
          SAFE_TITLE="${{ steps.generate.outputs.safe_title }}"

          echo "Compiling PDF..."

          if command -v pandoc &> /dev/null; then
            pandoc "$PAPER_DIR/paper.md" \
              -o "$PAPER_DIR/$SAFE_TITLE.pdf" \
              --pdf-engine=xelatex \
              --from markdown 2>/dev/null \
            || pandoc "$PAPER_DIR/paper.md" \
               -o "$PAPER_DIR/$SAFE_TITLE.pdf" \
               --pdf-engine=pdflatex \
               --from markdown 2>/dev/null \
            || {
                echo "PDF compilation failed — generating HTML instead"
                pandoc "$PAPER_DIR/paper.md" -o "$PAPER_DIR/$SAFE_TITLE.html" --standalone
              }
          else
            echo "pandoc not available — copying markdown"
            cp "$PAPER_DIR/paper.md" "$PAPER_DIR/$SAFE_TITLE.txt"
          fi

      - name: Generate publication record
        run: |
          export PAPER_DIR="${{ steps.generate.outputs.paper_dir }}"
          export SAFE_TITLE="${{ steps.generate.outputs.safe_title }}"
          export TITLE="${{ github.event.inputs.paper_title }}"
          export AUTHORS="${{ github.event.inputs.authors }}"
          export PROJECT="${{ github.event.inputs.project }}"
          python3 .github/scripts/generate-paper.py record

      - name: Upload paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ steps.generate.outputs.safe_title }}
          path: ${{ steps.generate.outputs.paper_dir }}
          retention-days: 90

      - name: Summary
        run: |
          echo "══════════════════════════════════"
          echo "  PAPER GENERATION COMPLETE"
          echo "══════════════════════════════════"
          echo "  Title:    ${{ github.event.inputs.paper_title }}"
          echo "  Project:  ${{ github.event.inputs.project }}"
          echo "  Authors:  ${{ github.event.inputs.authors }}"
          echo "  Output:   ${{ steps.generate.outputs.paper_dir }}"
          echo "══════════════════════════════════"
          echo ""
          echo "Next steps:"
          echo "  1. Review paper at ${{ steps.generate.outputs.paper_dir }}/paper.md"
          echo "  2. Fill in sections marked with <!-- --> comments"
          echo "  3. Download PDF artifact from this workflow run"
          echo "  4. Submit to ${{ github.event.inputs.journal }}"
